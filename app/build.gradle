plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cpnt2.demo'
    compileSdk 34

    defaultConfig {
        applicationId "com.cpnt2.demo"
        // claricodec-native (onnxruntime-android) 要求 minSdk 26
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets']
        }
    }

    // 强制统一 Kotlin 版本
    configurations.all {
        resolutionStrategy {
            eachDependency { DependencyResolveDetails details ->
                if (details.requested.group == 'org.jetbrains.kotlin') {
                    details.useVersion '1.8.22'
                }
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    // 神经编解码推理：直接使用 ONNX Runtime 的 Java 绑定驱动 enc/dec 两个 ONNX 图。
    // 不再依赖同事的 AAR / libclaricodec.so —— 其 C API 在 arm64 真机上创建会话即永久卡死
    // （详见 claricodec-native/REAL_DEVICE_CRASH_REPORT.md）；同模型走 Java 绑定完全正常。
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'

    // 显式指定 Kotlin 标准库版本
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"

    // 排除旧版本传递依赖
    implementation('androidx.appcompat:appcompat:1.6.1') {
        exclude group: 'org.jetbrains.kotlin'
    }
}